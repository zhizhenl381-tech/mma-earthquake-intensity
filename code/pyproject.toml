[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mma-macroseismic"
version = "1.0.1"
description = "MMA evidence processing, DYFI scoring and spatial intensity aggregation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "openpyxl>=3.1,<4", "httpx>=0.27,<1", "jsonschema>=4.20,<5", "pyproj>=3.6,<4"]

[project.scripts]
mma = "mma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
